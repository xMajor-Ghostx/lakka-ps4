# Lakka (LibreELEC 6.1 userspace, systemd 256) on the Strawberry PS4 kernel.
# Applied after the Strawberry profile configs. Lakka's own kernel modules (6.18.7) can't
# load into this kernel, so everything Lakka relies on is built in.

# --- boot: SYSTEM squashfs (zstd), PS4 layer (overlay), STORAGE ext4 image (loop)
enable CONFIG_SQUASHFS
enable CONFIG_SQUASHFS_XZ
enable CONFIG_SQUASHFS_ZSTD
enable CONFIG_OVERLAY_FS
enable CONFIG_BLK_DEV_LOOP
enable CONFIG_EXT4_FS_POSIX_ACL
enable CONFIG_TMPFS_POSIX_ACL
enable CONFIG_TMPFS_XATTR
enable CONFIG_FUSE_FS

# --- systemd 256
enable CONFIG_AUTOFS_FS
enable CONFIG_FHANDLE
enable CONFIG_FANOTIFY
enable CONFIG_NAMESPACES
enable CONFIG_USER_NS
enable CONFIG_PID_NS
enable CONFIG_NET_NS
enable CONFIG_CGROUP_BPF
enable CONFIG_CGROUP_PIDS
enable CONFIG_CGROUP_FREEZER
enable CONFIG_CGROUP_DEVICE
enable CONFIG_BPF_SYSCALL
enable CONFIG_SECCOMP
enable CONFIG_SECCOMP_FILTER
enable CONFIG_PSI
enable CONFIG_ZRAM
enable CONFIG_ZSMALLOC
enable CONFIG_IKCONFIG
enable CONFIG_IKCONFIG_PROC

# --- RetroArch input: virtual pads, raw HID, controllers Lakka supports (from Lakka's config)
enable CONFIG_INPUT_UINPUT
enable CONFIG_UHID
enable CONFIG_HIDRAW
enable CONFIG_INPUT_JOYDEV
enable CONFIG_INPUT_FF_MEMLESS
enable CONFIG_HID_SONY
enable CONFIG_SONY_FF
enable CONFIG_HID_PLAYSTATION
enable CONFIG_PLAYSTATION_FF
enable CONFIG_HID_NINTENDO
enable CONFIG_NINTENDO_FF
enable CONFIG_HID_STEAM
enable CONFIG_HID_MICROSOFT
enable CONFIG_HID_LOGITECH
enable CONFIG_HID_LOGITECH_DJ
enable CONFIG_HID_LOGITECH_HIDPP
enable CONFIG_LOGITECH_FF
enable CONFIG_HID_DRAGONRISE
enable CONFIG_DRAGONRISE_FF
enable CONFIG_HID_SMARTJOYPLUS
enable CONFIG_SMARTJOYPLUS_FF
enable CONFIG_INPUT_JOYSTICK
enable CONFIG_JOYSTICK_XPAD
enable CONFIG_JOYSTICK_XPAD_FF
enable CONFIG_JOYSTICK_XPAD_LEDS
enable CONFIG_BT_HIDP

# --- ROMs from USB sticks and network shares
enable CONFIG_USB_STORAGE
enable CONFIG_VFAT_FS
enable CONFIG_EXFAT_FS
enable CONFIG_NTFS3_FS
enable CONFIG_CIFS
enable CONFIG_NFS_FS
enable CONFIG_NFS_V4

# --- release: quiet, locked down, no debug interfaces (same as the ChromeOS release kernel)
enable CONFIG_CMDLINE_BOOL
set-str CONFIG_CMDLINE quiet loglevel=3
enable CONFIG_SECURITY
enable CONFIG_SECURITY_LOCKDOWN_LSM
enable CONFIG_SECURITY_LOCKDOWN_LSM_EARLY
enable CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY
set-str CONFIG_LSM lockdown,landlock,yama
enable CONFIG_STRICT_DEVMEM
enable CONFIG_IO_STRICT_DEVMEM
disable CONFIG_MAGIC_SYSRQ
disable CONFIG_NETCONSOLE
disable CONFIG_DEBUG_FS
disable CONFIG_FTRACE
disable CONFIG_KEXEC
disable CONFIG_KEXEC_FILE
