# Lakka for PS4 - PKG config for /mnt/build/ps4-linux-pkg/make-pkg.sh
#   /mnt/build/ps4-linux-pkg/make-pkg.sh /mnt/build/lakka-ps4/lakka.conf
# Paths are relative to this file.

TITLE="Lakka for PS4"
VERSION="01.00"
TITLE_ID="LAKK00001"
CONTENT_LABEL="LAKKAPS4LOADER00"
ICON="branding/icon0.png"         # official Lakka logo (from Lakka's boot splash)

KERNEL="kbuild-lakka/out/bzImage"           # scripts/build-kernel.sh
INITRAMFS="out/initramfs-lakka.cpio.gz"     # scripts/build-initramfs.sh
PAYLOAD="$HOME/Downloads/ps4 linux/bin/Linux_Loader_1G_VRAM.bin"

# Lakka's SYSTEM exactly as released + the PS4 layer (scripts/make-layer.sh).
EXTRA=(
  "dl/Lakka-Generic.x86_64-6.1/target/SYSTEM"
  "out/lakka-ps4-layer.sqfs"
)

# STORAGE (ROMs, saves, settings): the app reserves it from OrbisOS, the initramfs renames
# it to lakka-storage.img and formats it ext4 on the first boot, then writes lakka-installed.
RESERVE_NAME="lakka-storage.img.alloc"
DONE_MARKER="lakka-installed"
RESERVE_EXTRA_MB=0
SIZES="16 32 64 128 256"
MIN_GB=8
RECOMMENDED_GB=32
ALLOW_USB=0          # the Lakka initramfs installs to the PS4 drive only (for now)
KEEP_FREE_GB=10
