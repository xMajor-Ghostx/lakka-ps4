# ps4-linux-pkg config, sourced by make-pkg.sh (bash). Paths: absolute or relative to this file.
# drop/ holds the boot combo: replace those files (or point the paths elsewhere) for
# another kernel / initramfs / loader, then run ./make-pkg.sh.

# --- what the PKG is called on the PS4
TITLE="Linux for PS4"
VERSION="01.00"                   # NN.NN
TITLE_ID="LNUX00001"              # 4 capital letters + 5 digits; one per distro PKG
CONTENT_LABEL="PS4LINUXLOADER00"  # exactly 16 capital letters/digits
ICON=""                           # 512x512 PNG; empty = generated plain icon

# --- the boot combo. Installed under the names the loader reads (bzImage,
# initramfs.cpio.gz), whatever they are called here.
KERNEL="drop/bzImage"
INITRAMFS="drop/initramfs.cpio.gz"
PAYLOAD="drop/Linux_Loader_1G_VRAM.bin"   # loader payload, VRAM must match the console (max 512 KB)

# --- anything else the initramfs expects in /data/linux/boot (image, squashfs, config).
# "path" keeps the file name, "path:name" installs it as <name>.
EXTRA=(
)

# --- install menu + fast reserve (the ChromeOS for PS4 app's flow). Empty RESERVE_NAME
# = no menu: the app only copies and boots.
# The app asks PS4 drive / USB drive, then the size ("Next size" cycles SIZES that fit,
# plus "all the free space"), zero-fills /data/linux/boot/<RESERVE_NAME> from OrbisOS
# (live ETA, resumable), waits for the drive to go idle, then boots. The choice is saved in
# /data/linux/boot/install-choice for the initramfs:
#   target=internal + size_gib=<n>      or      target=external
# The initramfs takes the reserved file, installs, and writes DONE_MARKER; from then on
# the app never asks or reserves again.
RESERVE_NAME="disk.img.alloc"
RESERVE_EXTRA_MB=0                # added to the chosen size (partition table, boot partitions...)
SIZES="32 64 128 256"             # GB offered, up to 8
MIN_GB=8
RECOMMENDED_GB=32
ALLOW_USB=1                       # 0 = PS4 drive only, no first question
DONE_MARKER="install-done"
KEEP_FREE_GB=10                   # always left free on the PS4 drive
